name: AWS Benchmark

on:
  workflow_dispatch:
    inputs:
      workload:
        description: Canonical workload name
        required: true
        default: aggregate-concurrent
        type: choice
        options:
          - health
          - transform-small
          - transform-large
          - compute-sequential
          - items
          - aggregate-sequential
          - aggregate-concurrent
      image_uris:
        description: 'Immutable ECR digest URI per implementation key as JSON, e.g. {"python":"...@sha256:...","rust":"...@sha256:..."}'
        required: true
        type: string
      aws_region:
        description: AWS region
        required: true
        default: ap-northeast-1
        type: string
      destroy_after:
        description: Destroy benchmark infrastructure after the run
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-benchmark
  cancel-in-progress: false

jobs:
  # 安全な状態管理が確認できるまで、このworkflowのAWS操作を止める（回避策であり恒久修復ではない）。
  # runnerの中だけで作るTerraform stateは実行後に失われ、既存のECR等との衝突や、
  # 削除の失敗・destroy_after=false で残った資源を管理できなくなる（レビュー01 R-019）。
  # 再開には、state の永続化・排他・ECR の所有境界を直すか workflow を廃止するかを決め（D02）、
  # その方式を検証する必要がある（docs/10_全体構成と操作の地図.md の「7. CI」）。
  suspended:
    name: Suspended until Terraform state is managed safely
    runs-on: ubuntu-latest
    steps:
      - name: Stop before any AWS operation
        run: |
          echo "AWS Benchmark workflow is suspended: Terraform state is created only inside the runner and is lost after each run." >&2
          echo "Resume only after persistent state, locking, and ECR ownership are implemented and verified (review 01, R-019 / D02)." >&2
          exit 1

  # AWSの権限を引き受けるジョブのため、Actionはタグではなくコミットのsha（全40桁）で固定する。
  # タグは移動できるため、同じタグでも別のコードが動きうる。更新するときは、採用する版の
  # リリースノートと差分を確認し、`gh api repos/<owner>/<repo>/git/ref/tags/<tag>` で
  # そのタグのコミットを確かめてから、shaとコメントの版を一緒に書き換える。
  benchmark:
    name: Deploy and benchmark
    # 停止用のジョブが失敗するため、このジョブは常にスキップされ、always() の削除工程も動かない。
    needs: suspended
    runs-on: ubuntu-latest
    environment: benchmark
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      IMAGE_URIS: ${{ inputs.image_uris }}
      # Terraformの既定値と同じ条件で計測し、結果に記録する。
      ARCHITECTURE: arm64
      LAMBDA_MEMORY_MB: "512"
      WORKLOAD: ${{ inputs.workload }}
      RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require explicit AWS configuration
        run: |
          if [[ -z "$AWS_ROLE_TO_ASSUME" ]]; then
            echo "Configure AWS_ROLE_TO_ASSUME in the benchmark environment." >&2
            exit 2
          fi
          # spec/implementations.yaml の全実装に、digest固定のURIが指定されている場合だけ続ける。
          keys="$(yq -r '.implementations | keys | .[]' spec/implementations.yaml)"
          for key in $keys; do
            uri="$(jq -r --arg key "$key" '.[$key] // ""' <<<"$IMAGE_URIS")"
            if [[ "$uri" != *@sha256:* ]]; then
              echo "image_uris.$key must be an immutable ECR digest URI." >&2
              exit 2
            fi
          done
          jq '{image_uris: .}' <<<"$IMAGE_URIS" > infrastructure/terraform/images.auto.tfvars.json
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: Install benchmark dependencies
        run: uv sync --project benchmark --locked --extra dev
      - name: Deploy controlled environment
        run: make deploy TF_AUTO_APPROVE=-auto-approve
      # 接続先とロググループは make benchmark・make collect がTerraformの出力から読む。
      - name: Read Terraform outputs
        run: |
          echo "DYNAMODB_TABLE_NAME=$(terraform -chdir=infrastructure/terraform output -raw dynamodb_table_name)" >> "$GITHUB_ENV"
      - name: Seed deterministic data
        run: make seed
      - name: Run benchmark
        run: make benchmark
      # 固定時間の待機ではなく、ログがそろったかを確かめながら期限まで収集する。
      - name: Collect CloudWatch records
        run: make collect COLLECT_WAIT_SECONDS=180
      - name: Generate report
        run: make report
      - name: Upload raw data and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ env.RUN_ID }}
          path: |
            results/raw/${{ env.RUN_ID }}
            results/reports/${{ env.RUN_ID }}.md
            results/reports/${{ env.RUN_ID }}.csv
          if-no-files-found: warn
      - name: Destroy benchmark infrastructure
        if: always() && inputs.destroy_after
        run: make destroy TF_AUTO_APPROVE=-auto-approve
