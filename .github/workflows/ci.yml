name: CI

# 統合先（main）への push と、プルリクエストの更新で検証する。作業ブランチへの push だけでは
# 動かさず、同じコミットを push と pull_request の二重で検証しない。PRを作らない作業ブランチは
# 手動実行（workflow_dispatch）で検証できる。
# 変更がない間に見つかった依存の脆弱性にも気付けるよう、週に一度（月曜 09:00 JST）も動かす。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

# uv.lock が依存の定義と食い違えば、自動で直さずに失敗させる（uv の --locked と同じ）。
# --frozen は lock を更新しないだけで、食い違いを検出しない。
env:
  UV_LOCKED: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Check Python application
        run: |
          uv sync --project apps/python --locked
          uv run --project apps/python ruff format --check apps/python
          uv run --project apps/python ruff check apps/python
          uv run --project apps/python pytest apps/python/tests
      - name: Check benchmark tools
        run: |
          uv sync --project benchmark --locked --extra dev
          uv run --project benchmark --extra dev ruff format --check benchmark
          uv run --project benchmark --extra dev ruff check benchmark
          uv run --project benchmark --extra dev pytest benchmark/tests
      - name: Check Contract Test harness
        run: |
          uv sync --project tests/contract --locked
          uv run --project tests/contract ruff format --check tests/contract
          uv run --project tests/contract ruff check tests/contract
          make test-contract-harness

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/rust
      # Commands run inside apps/rust so that rust-toolchain.toml selects the
      # pinned toolchain instead of whatever default is installed.
      - name: Check formatting
        working-directory: apps/rust
        run: cargo fmt --check
      - name: Run Clippy
        working-directory: apps/rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        working-directory: apps/rust
        run: cargo test

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/typescript/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Check format and types
        run: npm run lint
      - name: Run tests
        run: npm test

  java:
    name: Java
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/java
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compile and run tests
        run: mvn -B verify

  docker-arm64:
    name: Docker (linux/arm64)
    # Lambdaと同じarm64のランナーで、エミュレーション（QEMU）なしにビルドする。
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # ビルド対象の言語は spec/implementations.yaml から読むため、読み取りに使うuvを用意する。
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build every implementation image
        run: make build

  contract:
    name: Shared Contract Test
    # arm64のイメージをエミュレーションなしで起動する。JVMなどはQEMU上では起動に失敗しやすい。
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Lambda images
        run: make build
      # 全言語のイメージをLambda RIEで起動し、DynamoDB Localと正本fixtureを準備して比較する。
      # 起動したコンテナはスクリプトが終了時に停止する。
      - name: Compare canonical responses of every implementation
        run: make contract-test

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 全言語のlockと依存の定義を、公開されている脆弱性の情報（OSV）と照合する。
      # 一件でも該当すれば失敗させ、修正版への更新を促す。照合の道具はdigestで固定する。
      - name: Check every lock file against known vulnerabilities
        run: |
          docker run --rm --volume "${PWD}:/src:ro" \
            ghcr.io/google/osv-scanner@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde \
            scan source \
            --lockfile /src/apps/python/uv.lock \
            --lockfile /src/apps/rust/Cargo.lock \
            --lockfile /src/apps/typescript/package-lock.json \
            --lockfile /src/apps/java/pom.xml \
            --lockfile /src/benchmark/uv.lock \
            --lockfile /src/tests/contract/uv.lock

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: Format and validate
        run: make terraform-validate
