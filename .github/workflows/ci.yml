name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check Python application
        run: |
          uv sync --project apps/python --frozen
          uv run --project apps/python ruff format --check apps/python
          uv run --project apps/python ruff check apps/python
          uv run --project apps/python pytest apps/python/tests
      - name: Check benchmark tools
        run: |
          uv sync --project benchmark --frozen --extra dev
          uv run --project benchmark --extra dev ruff format --check benchmark
          uv run --project benchmark --extra dev ruff check benchmark
          uv run --project benchmark --extra dev pytest benchmark/tests
      - name: Check Contract Test harness
        run: |
          uv sync --project tests/contract
          uv run --project tests/contract ruff format --check tests/contract
          uv run --project tests/contract ruff check tests/contract
          make test-contract-harness

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/rust
      # Commands run inside apps/rust so that rust-toolchain.toml selects the
      # pinned toolchain instead of whatever default is installed.
      - name: Check formatting
        working-directory: apps/rust
        run: cargo fmt --check
      - name: Run Clippy
        working-directory: apps/rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        working-directory: apps/rust
        run: cargo test

  docker-arm64:
    name: Docker (linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build Python image
        run: make build-python
      - name: Build Rust image
        run: make build-rust

  contract:
    name: Shared Contract Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build Lambda images
        run: make build
      - name: Start DynamoDB Local
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          docker run --detach --rm \
            --name contract-dynamodb \
            --publish 8000:8000 \
            amazon/dynamodb-local:latest
          for attempt in {1..30}; do
            if aws dynamodb list-tables \
              --endpoint-url http://127.0.0.1:8000 \
              --region us-east-1 >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs contract-dynamodb
              exit 1
            fi
            sleep 2
          done
          aws dynamodb create-table \
            --endpoint-url http://127.0.0.1:8000 \
            --region us-east-1 \
            --table-name lambda-runtime-lab-contract \
            --attribute-definitions AttributeName=id,AttributeType=S \
            --key-schema AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST
      - name: Seed canonical Contract Test fixtures
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          uv run --project tests/contract python tests/contract/seed_fixtures.py \
            --table lambda-runtime-lab-contract \
            --endpoint-url http://127.0.0.1:8000 \
            --region us-east-1
      - name: Start local Python API and Rust Lambda container
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: |
          nohup env \
            AWS_ENDPOINT_URL_DYNAMODB=http://127.0.0.1:8000 \
            DYNAMODB_TABLE_NAME=lambda-runtime-lab-contract \
            uv run --project apps/python --with uvicorn \
              uvicorn app.main:app --app-dir apps/python/src --host 127.0.0.1 --port 9001 \
              >/tmp/contract-python.log 2>&1 &
          echo "$!" >/tmp/contract-python.pid
          docker run --detach --rm \
            --name contract-rust \
            --platform linux/arm64 \
            --add-host host.docker.internal:host-gateway \
            --publish 9002:8080 \
            --env AWS_ACCESS_KEY_ID \
            --env AWS_SECRET_ACCESS_KEY \
            --env AWS_REGION \
            --env AWS_ENDPOINT_URL_DYNAMODB=http://host.docker.internal:8000 \
            --env DYNAMODB_TABLE_NAME=lambda-runtime-lab-contract \
            lambda-runtime-lab-rust:local
      - name: Wait for local runtimes
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9001/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              cat /tmp/contract-python.log
              exit 1
            fi
            sleep 2
          done
          event='{"version":"2.0","routeKey":"$default","rawPath":"/health","rawQueryString":"","headers":{},"requestContext":{"accountId":"123456789012","apiId":"local","domainName":"localhost","domainPrefix":"local","http":{"method":"GET","path":"/health","protocol":"HTTP/1.1","sourceIp":"127.0.0.1","userAgent":"ci"},"requestId":"health-check","routeKey":"$default","stage":"$default","time":"01/Jan/2026:00:00:00 +0000","timeEpoch":1767225600000},"body":null,"isBase64Encoded":false}'
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --data "$event" \
              "http://127.0.0.1:9002/2015-03-31/functions/function/invocations" \
              | jq --exit-status '.statusCode == 200' >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
              docker logs contract-rust || true
              exit 1
          fi
      - name: Compare canonical responses
        env:
          PYTHON_CONTRACT_TRANSPORT: direct
          RUST_CONTRACT_TRANSPORT: lambda-rie
          PYTHON_API_URL: http://127.0.0.1:9001
          RUST_API_URL: http://127.0.0.1:9002
        run: make contract-test
      - name: Show container logs after failure
        if: failure()
        run: |
          cat /tmp/contract-python.log || true
          docker logs contract-rust || true
          docker logs contract-dynamodb || true
      # バックグラウンドのuv runがuvキャッシュのロックを保持したままだと、
      # setup-uvの後処理（cache prune）がロック待ちで失敗するため、成否に関わらず停止する。
      - name: Stop local runtimes
        if: always()
        run: |
          if [[ -f /tmp/contract-python.pid ]]; then
            kill "$(cat /tmp/contract-python.pid)" 2>/dev/null || true
          fi
          pkill -f "uvicorn app.main:app" || true
          docker stop contract-rust contract-dynamodb >/dev/null 2>&1 || true

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format and validate
        run: make terraform-validate
