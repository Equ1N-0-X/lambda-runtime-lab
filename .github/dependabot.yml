# 依存・ベースイメージ・CIの部品の更新を、週に一度プルリクエストとして受け取る。
# 公開直後の版は取り込まず、7日経ってから提案させる（公開直後に見つかる問題を避ける）。
# 作業はdevelopへ統合してからmainへ反映するため、更新の提案もdevelopへ出させる。
version: 2
updates:
  - package-ecosystem: uv
    target-branch: develop
    directories: ["/apps/python", "/benchmark", "/tests/contract"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: cargo
    target-branch: develop
    directory: /apps/rust
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      rust: { patterns: ["*"] }
  - package-ecosystem: npm
    target-branch: develop
    directory: /apps/typescript
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      typescript: { patterns: ["*"] }
  - package-ecosystem: maven
    target-branch: develop
    directory: /apps/java
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      java: { patterns: ["*"] }
  - package-ecosystem: docker
    target-branch: develop
    directories: ["/apps/python", "/apps/rust", "/apps/typescript", "/apps/java"]
    schedule: { interval: weekly }
    groups:
      base-images: { patterns: ["*"] }
  - package-ecosystem: github-actions
    target-branch: develop
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    # 部品ごとに別々の提案にせず、一つにまとめる。
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: terraform
    target-branch: develop
    directory: /infrastructure/terraform
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
