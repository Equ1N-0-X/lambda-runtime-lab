<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lambda 言語比較</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Lambda 言語比較</h1>
      <p class="lede">同じ条件で計測した各言語の Lambda を比べます。</p>
    </header>

    <div id="job-banner" class="job-banner" role="status" hidden></div>

    <main class="layout">
      <aside class="sidebar">
        <nav class="side-card side-actions" aria-label="この画面でできること">
          <button type="button" id="open-launch" class="nav-action nav-action-primary">
            <span class="nav-action-title">＋ 新しく計測する</span>
            <span class="nav-action-note">各言語の Lambda に同じリクエストを送る</span>
          </button>
          <button type="button" id="open-estimate" class="nav-action">
            <span class="nav-action-title">月額料金を試算する</span>
            <span class="nav-action-note">計測結果から、言語ごとの月額を計算</span>
          </button>
        </nav>

        <section class="side-card run-list" aria-labelledby="run-list-title">
          <div class="run-list-head">
            <h2 id="run-list-title">計測履歴</h2>
            <button type="button" id="reload" class="ghost-button">再読み込み</button>
          </div>
          <div id="run-list-body" aria-live="polite">
            <p class="muted">読み込み中…</p>
          </div>
        </section>

        <section id="fixed-conditions" class="side-card" aria-labelledby="fixed-conditions-title" hidden></section>
      </aside>

      <section id="run-detail" class="run-detail" aria-live="polite">
        <p class="muted">読み込み中…</p>
      </section>
    </main>

    <div id="tooltip" class="tooltip" role="status" hidden></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
