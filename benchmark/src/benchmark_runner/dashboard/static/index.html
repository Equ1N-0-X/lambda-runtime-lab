<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lambda 言語比較</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Lambda 言語比較</h1>
      <p class="lede">同じ条件で計測した各言語の Lambda を比べます。</p>
    </header>

    <div id="job-banner" class="job-banner" role="status" hidden></div>

    <main class="layout">
      <nav class="run-list" aria-labelledby="run-list-title">
        <div class="run-list-head">
          <h2 id="run-list-title">計測履歴</h2>
          <button type="button" id="reload" class="ghost-button">再読み込み</button>
        </div>
        <button type="button" id="open-launch" class="primary-button">＋ 新しく計測する</button>
        <button type="button" id="open-estimate" class="ghost-button wide-button" aria-describedby="open-estimate-note">作りたいAPIの月額料金を見込む</button>
        <p id="open-estimate-note" class="run-list-note">計測済みの結果から、これから作るAPIの月額料金を言語ごとに見積もります。</p>
        <div id="run-list-body" aria-live="polite">
          <p class="muted">読み込み中…</p>
        </div>
      </nav>

      <section id="run-detail" class="run-detail" aria-live="polite">
        <p class="muted">読み込み中…</p>
      </section>
    </main>

    <div id="tooltip" class="tooltip" role="status" hidden></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
