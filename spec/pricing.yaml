version: 1
updated_at: 2026-09-11
region: ap-northeast-1
source: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AWSLambda/current/ap-northeast-1/index.json
currency: USD
request_price_per_million: 0.20
compute_price_per_gb_second:
  arm64: 0.0000133334
  x86_64: 0.0000166667
# 上の実行時間単価（Tier 1）を適用できる、1か月あたりの実行時間の使用量（GB秒）の上限。
# これを超える使用量では段階料金で単価が下がるため、見込みは参考値として扱う。
tier1_max_gb_seconds_per_month:
  arm64: 7500000000
  x86_64: 6000000000
# 計測1回にかかった料金の概算に使う、Lambda 以外のサービスの単価（最初の料金段階）。
# AWS Price List API（AmazonApiGateway・AmazonDynamoDB・AmazonCloudWatch の ap-northeast-1）で
# 2026-11-13 に確認した値。
other_services:
  # API Gateway HTTP API のリクエスト料金（最初の3億リクエストまで）。
  api_gateway_http_request_price_per_million: 1.29
  # DynamoDB オンデマンドの読み取り要求ユニットの料金。
  dynamodb_read_request_unit_price_per_million: 0.1425
  # CloudWatch Logs の取り込み料金（Standard ログクラス、最初の10TBまで）。
  cloudwatch_logs_ingestion_price_per_gb: 0.76
notes:
  - Tier 1 on-demand rates for Asia Pacific (Tokyo), verified against the AWS Price List API on 2026-09-11.
  - Values exclude the AWS Free Tier, Savings Plans, taxes, data transfer, API Gateway, DynamoDB, and other service charges.
  - The model is valid only below the Lambda duration Tier 1 thresholds: 7.5 billion GB-seconds/month for arm64 and 6 billion GB-seconds/month for x86_64.
