[project]
name = "lambda-runtime-lab-python"
version = "0.1.0"
description = "Python AWS Lambda Lambdalith benchmark implementation"
requires-python = "==3.13.*"
dependencies = [
    "awslambdaric==3.1.1",
    "boto3==1.40.25",
    "fastapi==0.116.1",
    "mangum==0.19.0",
    "pydantic==2.11.7",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "ruff==0.12.11",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
