[project]
name = "lambda-runtime-lab-python"
version = "0.1.0"
description = "Python AWS Lambda Lambdalith benchmark implementation"
requires-python = "==3.13.*"
dependencies = [
    "awslambdaric==4.2.3",
    "boto3==1.43.123",
    "fastapi==0.162.0",
    "mangum==0.22.0",
    "pydantic==2.14.2",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
