[project]
name = "lambda-runtime-lab-contract-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "pytest>=8.3,<9",
]

[dependency-groups]
dev = [
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "integration: sends canonical requests to running Python and Rust APIs",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
